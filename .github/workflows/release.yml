name: Release

# Triggers on pushed version tags, e.g. `git tag v0.1.0 && git push origin v0.1.0`.
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required so the updater plugin can sign release artifacts -
          # generate with `pnpm tauri signer generate` and store the
          # resulting private key / password as repo secrets.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          # Ad-hoc signing for unsigned beta macOS builds (see CLAUDE.md
          # Step 10c notes). Replace with a real Developer ID identity
          # before public launch.
          APPLE_SIGNING_IDENTITY: '-'
          # Sentry — baked into the shipped binaries at build time. Both are
          # safe to be visible in a built artifact (Sentry DSNs are public
          # identifiers, not secrets) but are still sourced from repo
          # secrets here so an empty/unset secret cleanly resolves to "" and
          # Sentry.init()/sentry::init() both treat that as disabled.
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN_DESKTOP }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN_DESKTOP }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Pagedge ${{ github.ref_name }}'
          releaseBody: 'See the assets below to download and install this version.'
          # Draft on purpose - gives a chance to review before it goes live.
          # NOTE: the in-app updater endpoint points at GitHub's
          # ".../releases/latest/download/latest.json" alias, which only
          # resolves once a release is published - the app won't see this
          # version until the draft is manually published.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
